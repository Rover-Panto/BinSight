[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "binsight-ml"
version = "1.1.0"
description = "BinSight Machine Learning & Smart Bin Overflow Forecasting Package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tests*"]
