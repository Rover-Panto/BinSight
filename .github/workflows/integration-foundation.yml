name: Integration foundation

on:
  push:
    branches: [codex/integration-test]
  pull_request:
    branches: [main, codex/integration-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server-and-fixtures:
    name: Foundation - server policy and fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s server/tests -v
      - run: python -m unittest discover -s integration/tests -v
      - run: python -m integration.check_readiness

  citizen-regression:
    name: Foundation - citizen regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:run
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: citizen-test-failures
          path: web/test-results/
          retention-days: 7
