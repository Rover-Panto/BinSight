[theme]
primaryColor = "#006DAE"
backgroundColor = "#F3F5F3"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172126"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
port = 8501
headless = true
enableXsrfProtection = true
enableCORS = true
fileWatcherType = "poll"
runOnSave = false

[logger]
level = "info"
